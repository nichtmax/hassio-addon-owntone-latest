worker_processes 1;
pid /run/owntone-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3692;
        # This listener is exclusively for authenticated HA ingress.
        allow 172.30.32.2;
        deny all;

        location = /ingress-websocket.js {
            alias /usr/local/share/owntone-addon/ingress-websocket.js;
            add_header Cache-Control "no-store";
        }

        location = /ws {
            proxy_pass http://127.0.0.1:3688/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:3689;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            # Only ingress HTML gets the shim; direct LAN access stays native.
            sub_filter '<head>' '<head><script src="./ingress-websocket.js"></script>';
            sub_filter_once on;
        }
    }
}
