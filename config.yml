name: Owntone server
version: 29.3-shairport23
slug: owntone-server
description: OwnTone is a Linux/FreeBSD DAAP (iTunes) media server with support for AirPlay devices, Apple Remote (and compatibles), MPD, Spotify, Chromecast, mp3 streaming and internet radio. It allows you to share your music collection over the local network.
arch:
  - aarch64
  - amd64
# NOTE: no ports: mappings — host_network binds all ports directly on the host.
# OwnTone: 3689 (DAAP/web/API), 3688 (websocket), 6600 (MPD), 3690/3691 (AirPlay).
# shairport-sync: 5000/tcp (RAOP), 6001-6003/udp (control/timing/audio).
map:
  - share:rw
# Host networking is REQUIRED for shairport-sync ingress: AirPlay/mDNS discovery
# is multicast and does not cross the Docker bridge NAT, so a bridge-mode
# container is invisible to phones on the LAN. OwnTone outbound still works.
host_network: true
host_dbus: false
host_ipc: false
# OwnTone's mDNS advertiser is the Rust libmdns crate, whose env_logger reads
# RUST_LOG (independent of OwnTone's own loglevel). Its fsm module spams
# "dropping truncated packet" / "couldn't parse packet" WARN lines for the
# constant mDNS chatter on a busy LAN. Suppress the whole crate; everything
# else keeps the default warn level.
environment:
  RUST_LOG: "warn,libmdns=error"
ingress: true
# The official owntone/owntone image uses BusyBox init + OpenRC (not s6-overlay).
# Let the base image's /sbin/init manage services via OpenRC.
init: false
hassio_api: false
auth_api: true
hassio_role: "default"
audio: true
ingress_port: 3689
webui: http://[HOST]:[PORT:3689]/
startup: application
boot: auto
options: 
  general:
    admin_password: ''
    loglevel: log
    high_resolution_clock: true
    start_buffer_ms: 2250
    trusted_networks:
      - 'localhost'
      - '192.168'
      - '172.17'
      - '172.30'
      - '10.'
  library:
    name: 'Hassio music'
    password: ''
    m3u_overrides: false
    itunes_overrides: false
    itunes_smartpl: false
  airplay: []
  chromecast: []
  shairport:
    name: "Multiroom"
    metadata_enabled: false

schema:
  general:
    admin_password: password?
    loglevel: str
    high_resolution_clock: bool?
    start_buffer_ms: int(0,10000)?
    trusted_networks: [str]
  library:
    name: str
    password: password?
    m3u_overrides: bool?
    itunes_overrides: bool?
    itunes_smartpl: bool?
  airplay:
    - name: str
      max_volume: int?
      permanent: bool?
      exclude: bool?
      password: password?
      raop_disable: bool?
      nickname: str?

  chromecast:
    - name: str
      max_volume: int?
      exclude: bool?
      nickname: str?
  shairport:
    name: str?
    metadata_enabled: bool?
